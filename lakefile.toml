name = "LearnLean"
version = "0.1.0"
defaultTargets = [
    "TheoremProvingInLean",
    "FunctionalProgrammingInLean",
    "LambdaCalculus",
    "errata",
]
builtinLint = true

[[lean_lib]]
name = "LambdaCalculus"
globs = ["LambdaCalculus.+"]

[[lean_lib]]
name = "TheoremProvingInLean"
globs = ["TheoremProvingInLean.+"]

[[lean_lib]]
name = "FunctionalProgrammingInLean"
globs = ["FunctionalProgrammingInLean.+"]

# Part of §2 Hello World
[[lean_exe]]
name = "feline"
root = "FunctionalProgrammingInLean.Feline"

# Part of §6 Monad Transformers
[[lean_exe]]
name = "doug"
root = "FunctionalProgrammingInLean.Doug"

[[lean_exe]]
name = "errata"
root = "Main"
