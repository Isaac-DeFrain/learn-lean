name = "LearnLean"
version = "0.1.0"
defaultTargets = ["TheoremProvingInLean", "LambdaCalculus", "errata"]
builtinLint = true

[[lean_lib]]
name = "TheoremProvingInLean"
globs = ["TheoremProvingInLean.+"]

[[lean_lib]]
name = "LambdaCalculus"
globs = ["LambdaCalculus.+"]

[[lean_exe]]
name = "errata"
root = "Main"
