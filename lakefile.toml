name = "LearnLean"
version = "0.1.0"
defaultTargets = [
    "TheoremProvingInLean",
    "FunctionalProgrammingInLean",
    "LambdaCalculus",
    "errata",
]
builtinLint = true

[[lean_lib]]
name = "TheoremProvingInLean"
globs = ["TheoremProvingInLean.+"]

[[lean_lib]]
name = "FunctionalProgrammingInLean"
globs = ["FunctionalProgrammingInLean.+"]

[[lean_exe]]
name = "feline"
root = "FunctionalProgrammingInLean.Feline"

[[lean_lib]]
name = "LambdaCalculus"
globs = ["LambdaCalculus.+"]

[[lean_exe]]
name = "errata"
root = "Main"
